# TrackTrack tuned for annotool: prioritize stable person IDs and recovery
# through occlusion over minimum compute cost.
# Based on Ultralytics tracktrack.yaml.

tracker_type: tracktrack

# Detection / association thresholds
track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.30
track_buffer: 90
match_thresh: 0.75
lost_match_thr: 0.90

# Multi-cue association
iou_weight: 0.40
reid_weight: 0.60
conf_weight: 0.05
angle_weight: 0.05

# Iterative assignment
penalty_p: 0.20
penalty_q: 0.40
reduce_step: 0.05

# Track-aware initialization
tai_thr: 0.55
min_track_len: 2

# Camera motion compensation
gmc_method: sparseOptFlow

# Appearance-based re-identification
with_reid: True
model: auto
